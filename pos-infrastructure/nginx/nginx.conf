worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. Identity Service (8081)
        location /api/identity/ {
            proxy_pass http://identity-service:8081/;
        }
        location ~ ^/api/(users|authorities|branches|restaurant|login-attempts) {
            proxy_pass http://identity-service:8081;
        }

        # 2. Catalog Service (8082)
        location ~ ^/api/(catalog|menu|items|categories|modifier-groups|taxes|stations|currencies|payment-methods) {
            proxy_pass http://catalog-service:8082;
        }

        # 3. Tables Service (8083)
        location ~ ^/api/(floor|zones|tables) {
            proxy_pass http://tables-service:8083;
        }

        # 4. Orders Service (8084)
        location ~ ^/api/(orders|kds) {
            proxy_pass http://orders-service:8084;
        }

        # 5. Payments Service (8085)
        location ~ ^/api/(payments|cash-registers|cash-sessions|tickets) {
            proxy_pass http://payments-service:8085;
        }

        # 6. Reporting Service (8086)
        location /api/reporting {
            proxy_pass http://reporting-service:8086;
        }

        # 7. Realtime SignalR Hubs (8087) — WebSocket + long read timeout for KDS
        location /hubs/ {
            proxy_pass http://realtime-hub-service:8087;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
