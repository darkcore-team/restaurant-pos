services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos-net

  identity-service:
    build:
      context: ..
      dockerfile: pos-infrastructure/docker/Service.Dockerfile
      args:
        SERVICE_DIR: identity-service
        PROJECT_NAME: IdentityService.Api
    environment:
      PORT: 8081
      ConnectionStrings__IdentityDb: ${NEON_POOLED_CONNECTION_STRING}
      Identity__Issuer: http://identity-service:8081
      Identity__CookieSecure: "false"
      Identity__CookieSameSite: Lax
      DATA_PROTECTION_KEY: ${DATA_PROTECTION_KEY:-dev-shared-csrf-key-change-in-production-32chars}
    networks:
      - pos-net

  catalog-service:
    build:
      context: ..
      dockerfile: pos-infrastructure/docker/Service.Dockerfile
      args:
        SERVICE_DIR: catalog-service
        PROJECT_NAME: CatalogService.Api
    environment:
      PORT: 8082
      ConnectionStrings__CatalogDb: ${NEON_POOLED_CONNECTION_STRING}
      Jwt__Authority: http://identity-service:8081
      Jwt__Audience: restaurant-pos
      Jwt__RequireHttpsMetadata: "false"
      DATA_PROTECTION_KEY: ${DATA_PROTECTION_KEY:-dev-shared-csrf-key-change-in-production-32chars}
    depends_on:
      - identity-service
    networks:
      - pos-net

  tables-service:
    build:
      context: ..
      dockerfile: pos-infrastructure/docker/Service.Dockerfile
      args:
        SERVICE_DIR: tables-service
        PROJECT_NAME: TablesService.Api
    environment:
      PORT: 8083
      ConnectionStrings__TablesDb: ${NEON_POOLED_CONNECTION_STRING}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: http://identity-service:8081
      Jwt__Audience: restaurant-pos
      Jwt__RequireHttpsMetadata: "false"
      DATA_PROTECTION_KEY: ${DATA_PROTECTION_KEY:-dev-shared-csrf-key-change-in-production-32chars}
    depends_on:
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - pos-net

  orders-service:
    build:
      context: ..
      dockerfile: pos-infrastructure/docker/Service.Dockerfile
      args:
        SERVICE_DIR: orders-service
        PROJECT_NAME: OrdersService.Api
    environment:
      PORT: 8084
      ConnectionStrings__OrdersDb: ${NEON_POOLED_CONNECTION_STRING}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: http://identity-service:8081
      Jwt__Audience: restaurant-pos
      Jwt__RequireHttpsMetadata: "false"
      DATA_PROTECTION_KEY: ${DATA_PROTECTION_KEY:-dev-shared-csrf-key-change-in-production-32chars}
    depends_on:
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks:
      - pos-net

  payments-service:
    build:
      context: ..
      dockerfile: pos-infrastructure/docker/Service.Dockerfile
      args:
        SERVICE_DIR: payments-service
        PROJECT_NAME: PaymentsService.Api
    environment:
      PORT: 8085
      ConnectionStrings__PaymentsDb: ${NEON_POOLED_CONNECTION_STRING}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: http://identity-service:8081
      Jwt__Audience: restaurant-pos
      Jwt__RequireHttpsMetadata: "false"
      DATA_PROTECTION_KEY: ${DATA_PROTECTION_KEY:-dev-shared-csrf-key-change-in-production-32chars}
    depends_on:
      rabbitmq:
        condition: service_healthy
      orders-service:
        condition: service_started
    networks:
      - pos-net

  reporting-service:
    build:
      context: ..
      dockerfile: pos-infrastructure/docker/Service.Dockerfile
      args:
        SERVICE_DIR: reporting-service
        PROJECT_NAME: ReportingService.Api
    environment:
      PORT: 8086
      ConnectionStrings__ReportingDb: ${NEON_POOLED_CONNECTION_STRING}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: http://identity-service:8081
      Jwt__Audience: restaurant-pos
      Jwt__RequireHttpsMetadata: "false"
      DATA_PROTECTION_KEY: ${DATA_PROTECTION_KEY:-dev-shared-csrf-key-change-in-production-32chars}
    depends_on:
      rabbitmq:
        condition: service_healthy
      orders-service:
        condition: service_started
    networks:
      - pos-net

  realtime-hub-service:
    build:
      context: ..
      dockerfile: pos-infrastructure/docker/Service.Dockerfile
      args:
        SERVICE_DIR: realtime-hub-service
        PROJECT_NAME: RealtimeHubService.Api
    environment:
      PORT: 8087
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__Authority: http://identity-service:8081
      Jwt__Audience: restaurant-pos
      Jwt__RequireHttpsMetadata: "false"
      DATA_PROTECTION_KEY: ${DATA_PROTECTION_KEY:-dev-shared-csrf-key-change-in-production-32chars}
    depends_on:
      rabbitmq:
        condition: service_healthy
      orders-service:
        condition: service_started
    networks:
      - pos-net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity-service
      - catalog-service
      - tables-service
      - orders-service
      - payments-service
      - reporting-service
      - realtime-hub-service
    networks:
      - pos-net

networks:
  pos-net:
    driver: bridge
