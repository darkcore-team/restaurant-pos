# Render Blueprint — 7 RestaurantPOS .NET 10 Microservices (Free Tier)

envVarGroups:
  - name: restaurant-pos-secrets
    envVars:
      - key: RabbitMq__Uri
        sync: false
      - key: DATA_PROTECTION_KEY
        generateValue: true

services:
  - type: web
    name: pos-identity
    runtime: docker
    plan: free
    dockerfilePath: ./pos-infrastructure/docker/identity.Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - fromGroup: restaurant-pos-secrets
      - key: ConnectionStrings__IdentityDb
        sync: false
      - key: Identity__Issuer
        value: https://pos-identity.onrender.com
      - key: Identity__CookieSecure
        value: "true"
      - key: Identity__CookieSameSite
        value: Lax

  - type: web
    name: pos-catalog
    runtime: docker
    plan: free
    dockerfilePath: ./pos-infrastructure/docker/catalog.Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - fromGroup: restaurant-pos-secrets
      - key: ConnectionStrings__CatalogDb
        sync: false
      - key: Jwt__Authority
        value: https://pos-identity.onrender.com
      - key: Jwt__Audience
        value: restaurant-pos
      - key: Jwt__RequireHttpsMetadata
        value: "true"

  - type: web
    name: pos-tables
    runtime: docker
    plan: free
    dockerfilePath: ./pos-infrastructure/docker/tables.Dockerfile
    dockerContext: .
