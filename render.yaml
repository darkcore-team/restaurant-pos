        value: https://pos-identity.onrender.com
      - key: Jwt__Audience
        value: restaurant-pos
      - key: Jwt__RequireHttpsMetadata
        value: "true"

  - type: web
    name: pos-payments
    runtime: docker
    plan: free
    dockerfilePath: ./pos-infrastructure/docker/payments.Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
